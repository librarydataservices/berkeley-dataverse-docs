project:
  type: website
  output-dir: docs

website:
  title: "UC Berkeley Library Dataverse Docs"
  navbar:
    title: false
    logo: assets/ucbl_dataverse_docs_logo.png
    logo-alt: "UC Berkeley Library Dataverse Docs Logo"
    left:
      - href: guides/index.qmd
        text: "Guides"
      - href: about/index.qmd
        text: "About"
    right:
      - href: https://datasets.lib.berkeley.edu/
        text: "Go to Dataverse"
        icon: box-arrow-up-right
        target: _blank
  page-footer:
    left: Copyright © 2026 The Regents of the University of California
    right:
      - icon: envelope
        href: mailto:librarydataservices@berkeley.edu
        target: _blank
        aria-label: Email Library Data Services
      - icon: github
        href: https://github.com/librarydataservices/berkeley-dataverse-docs
        target: _blank
        aria-label: GitHub Repository for this site


  sidebar:
    - id: about
      title: "About"
      style: "floating"
      contents: about
    - id: guides
      title: "Guides"
      style: "floating"
      contents: guides

language:
  title-block-modified: "Last Updated"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    mainfont: "Arial"
    grid:
      sidebar-width: 250px
      body-width: 700px
      margin-width: 300px
    axe: true



